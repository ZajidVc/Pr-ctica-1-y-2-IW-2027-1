<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos - Mosaico</title>
    <link rel="stylesheet" href="stylesBus.css">
    <script> 
    /* Declaración y ejecución de la función de forma automática */
        (function() 
        {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
<header class="barra-superior">
    <div class="filaSuperior">
        <h1 class="TituloGame">Gamer<span>Shop</span></h1>

    <label class="switch-modo" for="selector-modo">
        <input type="checkbox" id="selector-modo">
        <span class="deslizador"></span>
        <span class="etiqueta-modo">Modo Oscuro</span>
    </label>
</div>
<div class="filaInferior">
    <div class="contenedor-busqueda">
        <span class="icono-buscar"></span>
        <input type="text" id="inputBusqueda" placeholder="Buscar Producto Gamer ..."> 
    </div>
    <button id="abrirCarritoBtn" class="nav-btn-cart" aria-label="Ver Carrito">
        <div class="cart-icon-wrapper">
            🛒<span id="cart-badge" class="badge-top-right">0</span>  
        </div>
    </button>
</div>
</header>
    <main id="catalogoContainer" class="catalogo-grid"></main>
    <div id="noEncontrado" class="mensaje-vacio">
        <p>👾 No se encontraron productos con ese nombre.</p>
    </div>

<div id="modalCarrito" class="modal-carrito" style="display: none;">
    <div class="contenido-modal">
        <div class="encabezado-modal">
            <h2>🛒 Tu Carrito</h2>
            <button id="cerrarCarrito" class="btn-cerrar">&times;</button>
        </div>
        <div id="itemsenCarrito" class="items-carrito"></div>
        <div class="pie-modal">
            <p>Total: <strong id="totalCarrito">$0.00</strong></p>
            <button id="vaciarCarrito" class="btn-vaciar">Vaciar Carrito</button>
        </div>
    </div>
</div>
    <script type="module" src="App.js"></script>
</body>
</html>
