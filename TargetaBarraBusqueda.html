    <div id="noEncontrado" class="mensaje-vacio">
        <p>👾 No se encontraron productos con ese nombre.</p>
    </div>

    <!-- Script de búsqueda -->
    <script>
        const inputBusqueda = document.getElementById('inputBusqueda');
        const tarjetas = document.querySelectorAll('.tarjeta'); // Ajustado a tu clase .tarjeta
        const mensajeNoEncontrado = document.getElementById('noEncontrado');

        inputBusqueda.addEventListener('input', (e) => {
            const textoBusqueda = e.target.value.toLowerCase().trim();
            let matches = 0;

            tarjetas.forEach(tarjeta => {
                const nombre = tarjeta.getAttribute('data-nombre').toLowerCase();
                
                if (nombre.includes(textoBusqueda)) {
                    tarjeta.style.display = 'flex';
                    matches++;
                } else {
                    tarjeta.style.display = 'none';
                }
            });

            // mensaje no encontrado
            if (matches === 0) {
                mensajeNoEncontrado.style.display = 'block';
            } else {
                mensajeNoEncontrado.style.display = 'none';
            }
        });

       // --- Carrito con LocalStorage y Contador ---
        const botonesCarrito = document.querySelectorAll('.btn-carrito');
        const contadorCarrito = document.getElementById('contadorCarrito');

        // 1. Obtener productos guardados en localStorage (o iniciar lista vacía)
        let carrito = JSON.parse(localStorage.getItem('carritoGamer')) || [];

        function actualizarContador() {
            contadorCarrito.textContent = carrito.length;
        }

        botonesCarrito.forEach(boton => {
            const tarjeta = boton.closest('.tarjeta');
            // Toma el nombre desde data-nombre o desde el texto de la tarjeta
            const nombreProducto = tarjeta.getAttribute('data-nombre') || tarjeta.querySelector('.nombre').textContent;

            // 2. Si el producto ya estaba guardado, marcarlo al cargar la página
            if (carrito.includes(nombreProducto)) {
                tarjeta.classList.add('en-carrito');
                boton.textContent = '✔ En el carrito';
            }

            // 3. Al hacer clic, agregar o quitar de localStorage y actualizar contador
            boton.addEventListener('click', () => {
                tarjeta.classList.toggle('en-carrito');

                if (tarjeta.classList.contains('en-carrito')) {
                    boton.textContent = '✔ En el carrito';
                    if (!carrito.includes(nombreProducto)) {
                        carrito.push(nombreProducto);
                    }
                } else {
                    boton.textContent = '🛒 Agregar al carrito';
                    carrito = carrito.filter(item => item !== nombreProducto);
                }

                localStorage.setItem('carritoGamer', JSON.stringify(carrito));
                actualizarContador();
            });
        });

        // Mostrar la cantidad guardada al abrir la página
        actualizarContador();
    </script>
